[package]
name = "yi"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
rustyline = { version = "19", default-features = false, features = ["custom-bindings"] }
libc = "0.2"

[dev-dependencies]
parking_lot = "0.12"
